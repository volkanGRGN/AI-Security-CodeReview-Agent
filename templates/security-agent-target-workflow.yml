name: AI Security Agent

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  security-agent:
    name: Scan target repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: target

      - name: Checkout AI Security CodeReview Agent
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: volkanGRGN/AI-Security-CodeReview-Agent
          path: security-agent

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install scanner dependencies
        run: |
          python -m pip install -r security-agent/requirements.txt
          python -m pip install pip-audit

      - name: Run AI security scanner
        run: |
          CONFIG_ARG=""
          if [ -f target/.security-agent.yml ]; then
            CONFIG_ARG="--config .security-agent.yml"
          elif [ -f target/.security-agent.yaml ]; then
            CONFIG_ARG="--config .security-agent.yaml"
          elif [ -f target/.security-agent.json ]; then
            CONFIG_ARG="--config .security-agent.json"
          fi

          python security-agent/main.py target \
            --no-interactive \
            --severity LOW \
            --output target/security_report.md \
            $CONFIG_ARG

      - name: Write GitHub job summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          findings_path = Path("target/.security_findings.json")
          summary_path = Path("target/security_summary.md")

          if not findings_path.exists():
              summary = "## AI Security Agent\n\nNo scanner JSON output was produced.\n"
          else:
              data = json.loads(findings_path.read_text(encoding="utf-8"))
              counts = data.get("by_severity", {})
              total = data.get("total", 0)
              domains = ", ".join(data.get("project_info", {}).get("security_domains", []))
              skipped = ", ".join(data.get("project_info", {}).get("skipped_domains", []))
              findings = sorted(
                  data.get("findings", []),
                  key=lambda f: {"CRITICAL": 0, "HIGH": 1, "MEDIUM": 2, "LOW": 3, "INFO": 4}.get(f.get("severity"), 5),
              )[:20]

              lines = [
                  "## AI Security Agent",
                  "",
                  f"Total findings: **{total}**",
                  f"Active domains: `{domains or 'none'}`",
                  f"Skipped domains: `{skipped or 'none'}`",
                  "",
                  "| Severity | Count |",
                  "|---|---:|",
              ]
              for severity in ["CRITICAL", "HIGH", "MEDIUM", "LOW", "INFO"]:
                  lines.append(f"| {severity} | {counts.get(severity, 0)} |")

              if findings:
                  lines.extend(["", "### Top Findings", "", "| Severity | Finding | Location |", "|---|---|---|"])
                  for finding in findings:
                      location = f"{finding.get('file')}:{finding.get('line')}"
                      lines.append(f"| {finding.get('severity')} | {finding.get('name')} | `{location}` |")

              summary = "\n".join(lines) + "\n"

          summary_path.write_text(summary, encoding="utf-8")
          Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).write_text(summary, encoding="utf-8")
          PY

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-security-agent-report
          path: |
            target/security_report.md
            target/.security_findings.json
            target/security_summary.md
          if-no-files-found: ignore

      - name: Apply configured fail gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          order = {"CRITICAL": 0, "HIGH": 1, "MEDIUM": 2, "LOW": 3, "INFO": 4}
          data = json.loads(Path("target/.security_findings.json").read_text(encoding="utf-8"))
          threshold = data.get("config", {}).get("fail_threshold", "CRITICAL")
          threshold_rank = order.get(threshold, 0)
          counts = data.get("by_severity", {})
          failing = {
              severity: count
              for severity, count in counts.items()
              if count and order.get(severity, 99) <= threshold_rank
          }
          if failing:
              details = ", ".join(f"{count} {severity}" for severity, count in failing.items())
              raise SystemExit(f"Security gate failed at {threshold}: {details}")
          PY
